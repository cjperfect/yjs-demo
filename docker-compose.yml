services:
  # PostgreSQL 17 + pgvector 扩展
  # 复用 langchain-rag 项目同款镜像
  postgres:
    image: pgvector/pgvector:pg17
    container_name: yjs-demo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: yjs
      POSTGRES_PASSWORD: yjs
      POSTGRES_DB: yjs_demo
      # 默认 initdb 时自动启用 pgvector 扩展
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yjs -d yjs_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Redis 7（在线状态缓存 / Awareness 快照）
  redis:
    image: redis:7-alpine
    container_name: yjs-demo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
